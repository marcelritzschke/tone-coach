[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tone-coach-backend"
dynamic = ["version"]
description = "Backend for Tone Coach (FastAPI + Praat pitch analysis)"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
keywords = ["mandarin", "pronunciation", "pitch", "praat"]
authors = [
  { name = "Marcel Ritzschke", email = "24395815+marcelritzschke@users.noreply.github.com" },
]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "av",                  # in-process audio decoding; replaces pydub + the ffmpeg binary
  "edge-tts",            # reference voice, behind app.services.voice.ReferenceVoice
  "fastapi",
  "numpy",
  "praat-parselmouth",
  "pydantic",
  "python-multipart",
  "uvicorn[standard]",
]

[project.optional-dependencies]
# Only needed to regenerate the phrase corpus, never at runtime.
corpus = [
  "g2pM",
  "jieba",
  "pypinyin",
]

[dependency-groups]
dev = [
  "httpx",
  "mypy>=1.0.0",
  "pytest",
  "pytest-asyncio",
  "ruff",
]

[tool.hatch.version]
path = "app/__about__.py"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.mypy]
files = ["app", "scripts"]
ignore_missing_imports = true

[tool.ruff]
exclude = ["**/__init__.py"]
line-length = 90
indent-width = 4

[tool.ruff.format]
docstring-code-format = true

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # isort
    "D",    # pydocstyle (docstrings)
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
]
ignore = [
    "D103", # Missing docstring in public function
    "D203",
    "D213",
]
fixable = ["ALL"]
unfixable = []

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["D1", "D2", "D4"]
# Response models mirror the JSON contract, which is camelCase by convention.
"app/models/response.py" = ["N815"]
"app/services/corpus.py" = ["N815"]
